<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Doe hier jouw ding! */
      body {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 5rem 1fr;
        grid-template-rows: 5rem 1fr 4rem;
        gap: 1rem;
      }

      nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 0 1rem;
      }

      nav a {
        padding: 0.5rem;
        background-color: #fff;
        color: black;
        text-decoration: none;
      }

      main {
        grid-column: 1 / 3;
      }

      footer {
        grid-column: 1 / 3;
      }
    </style>
  </head>
  <body id="basic-layout-9">
    <header><h1>Basic Layout 9</h1></header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Over ons</a>
      <a href="#">Contact</a>
    </nav>
    <main><a href="../index.html">Terug naar het overzicht</a></main>
    <footer></footer>
  </body>
</html>
